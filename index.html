<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>旅行足跡地圖</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <header class="topbar">
    <h1>🧭 旅行足跡地圖</h1>
    <label class="city-switch">📍
      <select id="citySelect" aria-label="選擇城市"></select>
    </label>
  </header>

  <aside class="panel" id="panel">
    <button class="panel-toggle" id="panelToggle" aria-label="展開/收合面板">▾</button>

    <section class="stats">
      <div><span id="statDistance">0.00</span><small>公里</small></div>
      <div><span id="statPoints">0</span><small>足跡點</small></div>
      <div><span id="statTime">00:00</span><small>記錄時間</small></div>
    </section>

    <div class="status" id="status">尚未開始記錄</div>

    <section class="controls">
      <button id="btnRecord" class="primary">▶ 開始記錄</button>
      <button id="btnLocate" title="定位到目前位置">◎ 定位</button>
      <button id="btnDemo" title="模擬一段旅程（測試用）">✈ 模擬旅程</button>
    </section>

    <section class="trips">
      <div class="trips-head">
        <h2>我的旅程</h2>
        <label class="file-btn" title="匯入 GPX 檔">匯入 GPX<input type="file" id="gpxInput" accept=".gpx,application/gpx+xml" hidden /></label>
      </div>
      <ul id="tripList"></ul>
      <details class="flight-form" id="flightForm">
        <summary>✈ 新增飛行段</summary>
        <label>出發 <select id="flightFrom"></select></label>
        <label>抵達 <select id="flightTo"></select></label>
        <label>起飛 <input type="datetime-local" id="flightTime" /></label>
        <button id="btnAddFlight" class="primary">新增飛行段</button>
        <p class="hint">搭機時沒有記錄到也沒關係，手動補上就會畫出飛行弧線。若同一段記錄中兩點相距超過 100 公里，也會自動判定為飛行。</p>
      </details>
    </section>

    <section class="settings">
      <h2>設定</h2>
      <div class="avatar-row">
        <div id="avatarPreview"></div>
        <div class="avatar-ctrl">
          <div class="label">停留點頭像</div>
          <div class="avatar-btns">
            <label class="file-btn btn">上傳照片<input type="file" id="avatarFile" accept="image/*" hidden /></label>
            <input id="avatarEmoji" type="text" maxlength="8" placeholder="或輸入表情" aria-label="表情符號頭像" />
            <button id="avatarReset" title="還原為 📍">還原</button>
          </div>
        </div>
      </div>
      <label class="inline">停留多久算一個景點
        <select id="minStay">
          <option value="5">5 分鐘</option>
          <option value="10">10 分鐘</option>
          <option value="15">15 分鐘</option>
          <option value="20">20 分鐘</option>
          <option value="30">30 分鐘</option>
          <option value="60">1 小時</option>
        </select>
      </label>
    </section>

    <section class="export">
      <h2>下載軌跡 PDF</h2>
      <label>範圍
        <select id="pdfRange">
          <option value="city" id="pdfCityOpt">目前城市</option>
          <option value="view">目前地圖畫面</option>
          <option value="track">依軌跡自動縮放</option>
        </select>
      </label>
      <label>標題 <input id="pdfTitle" type="text" value="我的旅行足跡" maxlength="40" /></label>
      <button id="btnPdf" class="primary">⬇ 下載 PDF</button>
    </section>
  </aside>

  <div class="toast" id="toast" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
